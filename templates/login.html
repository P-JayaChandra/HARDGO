<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HardGo Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body style="min-height:100vh;display:grid;place-items:center;background:var(--bg-main);padding:20px">
<div style="width:min(430px,100%);background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
<div style="font-size:30px;font-weight:800;margin-bottom:6px">Hard<span style="color:var(--accent-electric)">Go</span></div>
<p style="color:var(--text-secondary);margin-bottom:22px">Electrical & electronics delivery platform</p>
<form id="login-form"><label>Email</label><input id="email" type="email" required placeholder="you@example.com" style="width:100%;margin:8px 0 15px;padding:13px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-main);color:var(--text-primary)"><label>Password</label><input id="password" type="password" required placeholder="Password" style="width:100%;margin:8px 0 15px;padding:13px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-main);color:var(--text-primary)"><button type="submit" style="width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent-electric);font-weight:800;cursor:pointer">Login</button><p id="msg" style="margin-top:14px;color:#ef4444"></p></form>
<div style="margin-top:22px;padding:14px;background:var(--bg-main);border-radius:12px;font-size:13px;line-height:1.7"><b>Demo accounts</b><br>Customer: customer@hardgo.com / pass123<br>Shop Owner: srisai@hardgo.com / pass123<br>Delivery: raju@hardgo.com / pass123<br>Admin: admin@hardgo.com / admin123</div>
</div>
<script>document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Logging in...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(d.success){location.href=d.redirect}else msg.textContent=d.message||'Login failed';});</script></body></html>
